<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in or register | LUXORA</title>
  <meta name="description" content="Log in or register for a LUXORA account. This is a frontend demonstration with no real authentication.">
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" crossorigin="anonymous">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/components.css" rel="stylesheet">
  <link href="css/responsive.css" rel="stylesheet">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" id="site-header"></header>

  <main id="main">
    <div class="container">
      <div class="auth">
        <h1 class="page-title">Your account</h1>
        <div class="notice" role="note"><i class="bi bi-info-circle" aria-hidden="true"></i>
          <p><strong>Demo only.</strong> There is no real sign-in. Nothing you type is checked, saved or sent.</p>
        </div>
        <div class="tabs" role="tablist" aria-label="Log in or register">
          <button class="tab" role="tab" id="loginTab" data-tab="login" aria-selected="true" aria-controls="loginPanel" type="button">Log in</button>
          <button class="tab" role="tab" id="registerTab" data-tab="register" aria-selected="false" aria-controls="registerPanel" tabindex="-1" type="button">Register</button>
        </div>
        <section class="form-card" id="loginPanel" role="tabpanel" aria-labelledby="loginTab">
          <form id="loginForm">
            <div class="field">
              <label for="loginEmail">Email address</label>
              <input id="loginEmail" name="email" type="email" autocomplete="email" aria-describedby="loginEmail-error">
              <p class="field-error" id="loginEmail-error"></p>
            </div>
            <div class="field">
              <label for="loginPassword">Password</label>
              <div class="input-wrap">
                <input id="loginPassword" name="password" type="password" autocomplete="current-password" aria-describedby="loginPassword-error">
                <button type="button" class="input-toggle" data-toggle-password="loginPassword" aria-pressed="false" aria-label="Show password"><i class="bi bi-eye" aria-hidden="true"></i></button>
              </div>
              <p class="field-error" id="loginPassword-error"></p>
            </div>
            <button type="submit" class="btn-lux btn-lux--block">Log in</button>
            <p class="form-status" id="loginStatus" role="status"></p>
          </form>
        </section>
        <section class="form-card" id="registerPanel" role="tabpanel" aria-labelledby="registerTab" hidden>
          <form id="registerForm">
            <div class="field">
              <label for="registerName">Full name</label>
              <input id="registerName" name="name" type="text" autocomplete="name" aria-describedby="registerName-error">
              <p class="field-error" id="registerName-error"></p>
            </div>
            <div class="field">
              <label for="registerEmail">Email address</label>
              <input id="registerEmail" name="email" type="email" autocomplete="email" aria-describedby="registerEmail-error">
              <p class="field-error" id="registerEmail-error"></p>
            </div>
            <div class="field">
              <label for="registerPassword">Password (at least 8 characters)</label>
              <div class="input-wrap">
                <input id="registerPassword" name="password" type="password" autocomplete="new-password" aria-describedby="registerPassword-error">
                <button type="button" class="input-toggle" data-toggle-password="registerPassword" aria-pressed="false" aria-label="Show password"><i class="bi bi-eye" aria-hidden="true"></i></button>
              </div>
              <p class="field-error" id="registerPassword-error"></p>
            </div>
            <button type="submit" class="btn-lux btn-lux--block">Create demo account</button>
            <p class="form-status" id="registerStatus" role="status"></p>
          </form>
        </section>
      </div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous" defer></script>
  <script src="js/products.js" defer></script>
  <script src="js/storage.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/login.js" defer></script>
</body>
</html>
