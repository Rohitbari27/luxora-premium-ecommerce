<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your cart | LUXORA</title>
  <meta name="description" content="Review the items in your LUXORA shopping cart, update quantities and continue to checkout.">
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" crossorigin="anonymous">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/components.css" rel="stylesheet">
  <link href="css/responsive.css" rel="stylesheet">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" id="site-header"></header>

  <main id="main">
    <div class="container">
      <div class="page-head">
        <nav class="crumbs" aria-label="Breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="index.html">Home</a></li><li class="breadcrumb-item active" aria-current="page">Cart</li></ol></nav>
        <h1 class="page-title">Your cart</h1>
      </div>
      <div class="row g-4 g-xl-5 pb-5" id="cartContent" hidden>
        <div class="col-lg-8"><ul class="cart-list" id="cartItems"></ul></div>
        <div class="col-lg-4"><aside class="summary" id="cartSummary" aria-label="Order summary"></aside></div>
      </div>
      <div class="empty-state" id="cartEmpty" hidden>
        <h2>Your cart is empty</h2>
        <p>Add something you love and it will wait for you here.</p>
        <a class="btn-lux" href="shop.html">Continue shopping</a>
      </div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous" defer></script>
  <script src="js/products.js" defer></script>
  <script src="js/storage.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/cart.js" defer></script>
</body>
</html>
